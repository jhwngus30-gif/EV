<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Incoterms Margin Engine{% endblock %}</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;1,6..72,400&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            sand: {
              50: '#FAF8F5',
              100: '#EFECE6',
              200: '#E2DDD3',
              300: '#C7BEAF',
              700: '#524D44',
              800: '#2F2C27',
              900: '#1B1917',
            }
          },
          fontFamily: {
            serif: ['Newsreader', 'Georgia', 'serif'],
            sans: ['Plus Jakarta Sans', 'sans-serif'],
          }
        }
      }
    }
  </script>
</head>
<body class="bg-sand-100 text-sand-800 font-sans antialiased min-h-screen flex flex-col justify-between">

  <!-- 1. 최상단 실시간 외환 환율 바 -->
  <div class="bg-sand-200/90 border-b border-sand-300/70 px-4 sm:px-8 py-2 text-xs">
    <div class="max-w-7xl mx-auto flex flex-wrap items-center justify-between gap-2">
      <div class="flex items-center gap-4">
        <span class="flex items-center gap-1.5 font-bold tracking-wider text-[11px] text-sand-900">
          <span class="w-2 h-2 rounded-full bg-emerald-600 animate-pulse"></span> FOREX LIVE
        </span>
        <div class="flex items-center gap-3 text-xs">
          <span>USD <b id="tickerUSD" class="font-bold text-sand-900 ml-0.5">1,360 ₩</b></span>
          <span class="hidden sm:inline text-sand-700">EUR <b id="tickerEUR" class="font-medium ml-0.5">-</b></span>
          <span class="hidden md:inline text-sand-700">JPY <b id="tickerJPY" class="font-medium ml-0.5">-</b></span>
        </div>
      </div>
      <div class="flex items-center gap-2">
        <button onclick="fetchLiveRates(true)" class="px-2.5 py-1 bg-sand-50 hover:bg-white rounded-full border border-sand-300 text-[11px] transition">
          <i class="fa-solid fa-rotate text-[10px]"></i> 환율 갱신
        </button>
        <button onclick="applyLiveRateToCalc()" class="px-3 py-1 bg-sand-900 hover:bg-black text-white rounded-full text-[11px] font-semibold transition shadow-sm">
          계산기에 실시간 환율 적용
        </button>
      </div>
    </div>
  </div>

  <!-- 2. 메인 네비게이션 헤더 (사이트 로고 명칭 변경 반영) -->
  <header class="border-b border-sand-200 bg-sand-100/95 backdrop-blur sticky top-0 z-30 px-4 sm:px-8">
    <div class="max-w-7xl mx-auto h-16 flex items-center justify-between">
      
      <!-- 사이트 로고 및 이름 -->
      <a href="/" class="flex items-center gap-2.5">
        <div class="w-9 h-9 rounded-full bg-sand-900 text-sand-50 flex items-center justify-center font-serif italic text-base shadow-sm">
          I
        </div>
        <span class="font-serif text-xl sm:text-2xl font-semibold tracking-tight text-sand-900">Incoterms Margin Engine</span>
      </a>

      <!-- 데스크톱용 서브메뉴 -->
      <nav class="hidden md:flex items-center gap-2">
        <a href="/" class="px-4 py-2 rounded-full text-xs font-semibold transition {% if request.path == '/' %}bg-sand-900 text-white shadow-sm{% else %}text-sand-700 hover:bg-sand-200/70{% endif %}">
          마진 시뮬레이터
        </a>
        <a href="/breakdown" class="px-4 py-2 rounded-full text-xs font-semibold transition {% if request.path == '/breakdown' %}bg-sand-900 text-white shadow-sm{% else %}text-sand-700 hover:bg-sand-200/70{% endif %}">
          상세 원가명세서
        </a>
        <a href="/guide" class="px-4 py-2 rounded-full text-xs font-semibold transition {% if request.path == '/guide' %}bg-sand-900 text-white shadow-sm{% else %}text-sand-700 hover:bg-sand-200/70{% endif %}">
          인코텀즈 2020 실무
        </a>
      </nav>

      <!-- 모바일 퀵 버튼 -->
      <div class="flex md:hidden items-center gap-2">
        <a href="/guide" class="w-9 h-9 rounded-full bg-sand-50 border border-sand-200 flex items-center justify-center text-sand-800"><i class="fa-solid fa-book-open text-xs"></i></a>
        <a href="/breakdown" class="w-9 h-9 rounded-full bg-sand-50 border border-sand-200 flex items-center justify-center text-sand-800"><i class="fa-solid fa-file-invoice text-xs"></i></a>
      </div>
    </div>
  </header>

  <!-- 3. 메인 콘텐츠 -->
  <main class="flex-grow max-w-7xl w-full mx-auto px-4 sm:px-8 py-6 sm:py-10 pb-28 md:pb-12">
    {% block content %}{% endblock %}
  </main>

  <!-- 4. 하단 플로팅 인풋/어드바이저 바 -->
  <div class="fixed bottom-5 left-0 right-0 max-w-lg md:max-w-xl mx-auto px-4 pointer-events-none z-40">
    <div class="pointer-events-auto bg-sand-50/95 backdrop-blur-md border border-sand-200 rounded-full p-1.5 pl-4 shadow-xl flex items-center gap-2">
      <input id="quickChatInput" type="text" placeholder="인코텀즈 조건, 관세 환급, 마진율 질문..." class="flex-1 bg-transparent text-xs sm:text-sm text-sand-900 placeholder-sand-300 focus:outline-none">
      <button id="openModalBtn" onclick="openChatModal()" class="w-9 h-9 rounded-full bg-sand-200 text-sand-800 hover:bg-sand-300 flex items-center justify-center transition" title="대화창 전체보기">
        <i class="fa-solid fa-expand text-xs"></i>
      </button>
      <button id="quickSendBtn" class="w-9 h-9 rounded-full bg-sand-900 hover:bg-black text-white flex items-center justify-center transition shadow-sm">
        <i class="fa-solid fa-arrow-up text-xs"></i>
      </button>
    </div>
  </div>

  <!-- 5. 대형 AI 챗봇 모달 (대화 기억 및 가독성 최적화) -->
  <div id="aiModal" class="hidden fixed inset-0 bg-sand-900/50 backdrop-blur-sm z-50 flex items-center justify-center p-3 sm:p-6">
    <div class="bg-sand-50 w-full max-w-2xl h-[85vh] max-h-[750px] rounded-3xl border border-sand-200 shadow-2xl flex flex-col overflow-hidden">
      
      <!-- 모달 헤더 -->
      <div class="flex justify-between items-center px-6 py-4 border-b border-sand-200 bg-sand-100/60">
        <div class="flex items-center gap-2.5">
          <div class="w-3 h-3 rounded-full bg-emerald-600"></div>
          <span class="font-serif italic font-bold text-xl text-sand-900">Trade Advisory AI</span>
          <span class="text-[11px] bg-sand-200 text-sand-700 px-2 py-0.5 rounded-full font-medium">대화 맥락 기억 중</span>
        </div>
        <div class="flex items-center gap-2">
          <button onclick="clearChatHistory()" class="text-xs text-sand-700 hover:text-rose-600 px-2.5 py-1 rounded-lg border border-sand-200 bg-white transition" title="대화 내용 초기화">
            <i class="fa-solid fa-trash-can mr-1"></i>대화 비우기
          </button>
          <button id="closeAiModal" class="w-8 h-8 rounded-full hover:bg-sand-200 flex items-center justify-center text-sand-700">
            <i class="fa-solid fa-xmark text-base"></i>
          </button>
        </div>
      </div>

      <!-- 메시지 목록 스크롤 영역 -->
      <div id="chatMessages" class="flex-1 p-6 overflow-y-auto space-y-4 text-sm leading-relaxed bg-sand-50">
        <div class="flex gap-3">
          <div class="w-8 h-8 rounded-full bg-sand-900 text-white flex-shrink-0 flex items-center justify-center font-serif text-xs">AI</div>
          <div class="bg-sand-100 border border-sand-200 p-4 rounded-2xl max-w-[85%] text-sand-900 shadow-sm text-sm">
            안녕하세요! Incoterms 2020 규칙, 해상/항공 운임, 관세 및 정산 마진 개선에 대해 무엇이든 질문해주세요.
          </div>
        </div>
      </div>

      <!-- 모달 하단 인풋창 -->
      <div class="p-4 bg-sand-100/80 border-t border-sand-200 flex gap-2 items-center">
        <input id="modalInput" type="text" placeholder="질문을 입력하세요 (예: 컨테이너 화물에 FOB 대신 FCA를 써야 하는 이유가 뭐야?)" class="flex-1 px-4 py-3 bg-white border border-sand-200 rounded-2xl text-sm text-sand-900 focus:outline-none focus:border-sand-800 shadow-inner">
        <button id="modalSendBtn" class="px-5 py-3 bg-sand-900 hover:bg-black text-white rounded-2xl text-sm font-semibold transition shadow-sm flex items-center gap-1.5">
          <span>전송</span>
          <i class="fa-solid fa-paper-plane text-xs"></i>
        </button>
      </div>
    </div>
  </div>

  <!-- 푸터 -->
  <footer class="border-t border-sand-200 bg-sand-100 py-6 text-center text-xs text-sand-700">
    © 2026 Incoterms Margin Engine. All Rights Reserved.
  </footer>

  <script>
    let currentLiveUsdKrw = 1360.0;
    let chatHistory = JSON.parse(sessionStorage.getItem("tradeChatHistory") || "[]");

    async function fetchLiveRates(showAlert = false) {
      try {
        const res = await fetch('/api/live-rates');
        const data = await res.json();
        const r = data.rates;
        currentLiveUsdKrw = r.KRW;
        document.getElementById('tickerUSD').innerText = Number(r.KRW).toLocaleString() + ' ₩';
        document.getElementById('tickerEUR').innerText = Math.round(r.KRW / r.EUR).toLocaleString() + ' ₩';
        document.getElementById('tickerJPY').innerText = Math.round((r.KRW / r.JPY) * 100).toLocaleString() + ' ₩';
        if (showAlert) alert('실시간 환율이 동기화되었습니다.');
      } catch (e) {
        console.error('환율 조회 실패:', e);
      }
    }

    function applyLiveRateToCalc() {
      const exInput = document.getElementById('exchange_rate');
      if (exInput) {
        exInput.value = currentLiveUsdKrw;
        if (typeof updateCalculations === 'function') updateCalculations();
        alert(`실시간 환율(${currentLiveUsdKrw}원)이 적용되었습니다.`);
      }
    }

    // AI 모달 및 대화 기억 로직
    const aiModal = document.getElementById('aiModal');
    const closeAiModal = document.getElementById('closeAiModal');
    const chatMessages = document.getElementById('chatMessages');
    const modalInput = document.getElementById('modalInput');
    const modalSendBtn = document.getElementById('modalSendBtn');
    const quickChatInput = document.getElementById('quickChatInput');
    const quickSendBtn = document.getElementById('quickSendBtn');

    function openChatModal() {
      aiModal.classList.remove('hidden');
      renderStoredMessages();
    }

    function closeChatModal() {
      aiModal.classList.add('hidden');
    }

    function renderStoredMessages() {
      chatMessages.innerHTML = `
        <div class="flex gap-3">
          <div class="w-8 h-8 rounded-full bg-sand-900 text-white flex-shrink-0 flex items-center justify-center font-serif text-xs">AI</div>
          <div class="bg-sand-100 border border-sand-200 p-4 rounded-2xl max-w-[85%] text-sand-900 shadow-sm text-sm">
            안녕하세요! Incoterms 2020 규칙, 해상/항공 운임, 관세 및 정산 마진 개선에 대해 무엇이든 질문해주세요.
          </div>
        </div>
      `;
      chatHistory.forEach(msg => {
        if (msg.role === 'user') {
          chatMessages.innerHTML += `
            <div class="flex justify-end">
              <div class="bg-sand-900 text-white px-4 py-3 rounded-2xl max-w-[80%] text-sm shadow-sm">${msg.content}</div>
            </div>
          `;
        } else if (msg.role === 'assistant') {
          chatMessages.innerHTML += `
            <div class="flex gap-3">
              <div class="w-8 h-8 rounded-full bg-sand-900 text-white flex-shrink-0 flex items-center justify-center font-serif text-xs">AI</div>
              <div class="bg-sand-100 border border-sand-200 p-4 rounded-2xl max-w-[85%] text-sand-900 shadow-sm text-sm whitespace-pre-wrap">${msg.content}</div>
            </div>
          `;
        }
      });
      chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    function clearChatHistory() {
      if (confirm("대화 내역을 모두 비우시겠습니까?")) {
        chatHistory = [];
        sessionStorage.removeItem("tradeChatHistory");
        renderStoredMessages();
      }
    }

    async function handleSend(text) {
      if (!text) return;
      openChatModal();

      chatHistory.push({ role: "user", content: text });
      sessionStorage.setItem("tradeChatHistory", JSON.stringify(chatHistory));
      renderStoredMessages();

      const loadingId = "loading-" + Date.now();
      chatMessages.innerHTML += `
        <div id="${loadingId}" class="flex gap-3">
          <div class="w-8 h-8 rounded-full bg-sand-900 text-white flex-shrink-0 flex items-center justify-center font-serif text-xs">AI</div>
          <div class="bg-sand-100 border border-sand-200 p-4 rounded-2xl text-sand-700 text-sm animate-pulse">
            Incoterms 실무 데이터 및 무역 기준을 검토 중입니다...
          </div>
        </div>
      `;
      chatMessages.scrollTop = chatMessages.scrollHeight;

      try {
        const res = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ messages: chatHistory })
        });
        const data = await res.json();
        const reply = data.reply || "답변을 불러오지 못했습니다.";
        
        chatHistory.push({ role: "assistant", content: reply });
        sessionStorage.setItem("tradeChatHistory", JSON.stringify(chatHistory));
        renderStoredMessages();
      } catch (err) {
        document.getElementById(loadingId)?.remove();
        chatMessages.innerHTML += `<div class="p-3 bg-rose-100 text-rose-800 text-xs rounded-xl">네트워크 연결 오류가 발생했습니다.</div>`;
      }
    }

    quickSendBtn.onclick = () => {
      const val = quickChatInput.value.trim();
      quickChatInput.value = '';
      handleSend(val);
    };
    quickChatInput.onkeypress = (e) => {
      if (e.key === 'Enter') {
        const val = quickChatInput.value.trim();
        quickChatInput.value = '';
        handleSend(val);
      }
    };

    modalSendBtn.onclick = () => {
      const val = modalInput.value.trim();
      modalInput.value = '';
      handleSend(val);
    };
    modalInput.onkeypress = (e) => {
      if (e.key === 'Enter') {
        const val = modalInput.value.trim();
        modalInput.value = '';
        handleSend(val);
      }
    };

    closeAiModal.onclick = closeChatModal;

    window.addEventListener('DOMContentLoaded', () => {
      fetchLiveRates();
      if (chatHistory.length > 0) renderStoredMessages();
    });
  </script>
</body>
</html>
